# Stage 27 — full stack. `docker compose up` from repo root (or docker/).
# Services: redis, api, scheduler, ingest, dashboard.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m src.streaming.scheduler
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped

  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m src.data.realtime
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    profiles: ["live"]   # only with --profile live (polling is optional)

  dashboard:
    build:
      context: ../src/dashboard/web
      dockerfile: ../../../docker/Dockerfile.web
    ports: ["3000:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  redis_data:
